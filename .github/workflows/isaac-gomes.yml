# =============================================================================
# PIPELINE DE CI (Integração Contínua) - Isaac Gomes - AP1 Entrega Contínua
# Issues #43, #45 e #47 (nome do cliente no checkout)
# -----------------------------------------------------------------------------
# ONDE FICA: .github/workflows/isaac-gomes.yml
#   O GitHub Actions só procura workflows na pasta .github/workflows/.
#   O nome do arquivo segue o README do projeto: <nome-do-aluno-ou-feature>.yml
#   O GitHub roda a versão deste arquivo que está NA BRANCH que recebeu o push.
#   Por isso ele existe nas 3 branches (43, 45 e 47).
#
# FLUXO EM FILA:   lint  --->  test  --->  build
#   Cada seta é um "needs". Se um job falha, os seguintes ficam "skipped".
#
# COMANDOS: os "comandos base para CI" do README (python tasks.py ...).
# =============================================================================

# name: nome do workflow, como aparece na aba "Actions" do GitHub.
name: CI - Isaac Gomes

# on: o GATILHO, ou seja, o evento que dispara o workflow.
on:
  # push: roda a cada "git push" que chega ao GitHub, em qualquer branch.
  push:

# permissions: o que o token automático do workflow (GITHUB_TOKEN) pode fazer.
# contents: read = só ler o código. O pipeline não precisa de mais que isso.
permissions:
  contents: read

# jobs: os trabalhos do pipeline. Cada job roda num runner (máquina virtual)
# NOVO e SEPARADO, que é apagado no final: um job não enxerga os arquivos do
# outro. Por isso TODO job repete checkout + setup-python + dependências.
jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 - LINT: análise estática com o Ruff (acha erros sem executar o código)
  # ---------------------------------------------------------------------------
  lint:
    # runs-on: sistema operacional da máquina que o GitHub cria para este job.
    runs-on: ubuntu-latest
    # steps: os passos do job, em ordem. Se um passo falha, o job para ali.
    steps:
      # uses: usa uma ACTION pronta, publicada no GitHub (@v7 = versão major).
      # checkout: baixa o código do repositório, no commit do push, para o runner.
      # Sem ele a máquina começa vazia e nenhum comando acha os arquivos.
      - name: Baixar código
        uses: actions/checkout@v7

      # setup-python: instala o Python na versão pedida no "with".
      - name: Configurar Python
        uses: actions/setup-python@v7
        # with: parâmetros passados para a action.
        with:
          # 3.12 = mesma versão da imagem do Dockerfile (python:3.12-slim).
          python-version: "3.12"

      # run: executa um COMANDO no terminal do runner (o que eu digitaria).
      # requirements-dev.txt = dependências do app + pytest + ruff.
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      # CONTROLE DO JOB. "tasks.py lint" executa "python -m ruff check .",
      # com as regras do pyproject.toml. Achou problema: sai com erro = vermelho.
      - name: Lint com Ruff
        run: python tasks.py lint

  # ---------------------------------------------------------------------------
  # JOB 2 - TEST: executa os testes automatizados com o pytest
  # ---------------------------------------------------------------------------
  test:
    # needs: dependência. Só começa se o job "lint" terminar com SUCESSO.
    # Se o lint falhar, este job nem roda: fica "skipped" (pulado).
    needs: lint
    runs-on: ubuntu-latest
    steps:
      # Máquina nova e vazia: repete checkout, Python e dependências.
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      # CONTROLE DO JOB. "tasks.py test" executa "python -m pytest".
      # Um teste falhou: sai com erro = vermelho.
      - name: Testes com pytest
        # env: variável de ambiente só deste passo. PYTEST_ADDOPTS=-v liga o
        # modo "verbose": o log lista cada teste pelo nome, com PASSED/FAILED.
        env:
          PYTEST_ADDOPTS: "-v"
        run: python tasks.py test

  # ---------------------------------------------------------------------------
  # JOB 3 - BUILD: compila todo o código Python para bytecode (.pyc)
  # ---------------------------------------------------------------------------
  build:
    # needs: só roda se o "test" passar (e o test só roda se o lint passar).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Só as dependências de produção (requirements.txt), igual à etapa
      # "builder" do Dockerfile. Pytest e Ruff não fazem parte do produto.
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      # CONTROLE DO JOB. "tasks.py build" executa
      # "python -m compileall -q app scripts tasks.py": compila cada arquivo .py.
      # Erro de sintaxe em qualquer arquivo: sai com erro = vermelho.
      # O -q (quiet) só imprime se der erro: log sem mensagens + verde = build OK.
      - name: Build com compileall
        run: python tasks.py build

  # ===========================================================================
  # LAB BUILD + TRIVY + RELEASE (Integração DevOps, aula prática)
  # Fluxo completo:  lint ---> test ---> build ---> imagem
  #                                                 (Build -> Trivy -> Release)
  # ---------------------------------------------------------------------------
  # Por que um job só, com vários steps? Jobs rodam em runners diferentes e
  # não compartilham a imagem local. No MESMO job, a imagem construída fica no
  # Docker do runner: o Trivy analisa e o push envia EXATAMENTE a mesma
  # referência (mesmo nome:tag), sem reconstruir nada depois do scan.
  # ===========================================================================
  imagem:
    # needs: só começa se a CI anterior inteira (lint -> test -> build) passar.
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Actions novas fixadas pelo SHA do commit (a tag fica no comentário):
      # uma tag pode ser movida para outro código; um SHA não.
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Define UMA vez a referência usada por Build, Trivy e Release.
      # Formato: USUARIO/devops-market:<branch>-<sha7>
      #   ex.: usuario/devops-market:feature-47-testes-nome-cliente-a1b2c3d
      # A "/" da branch vira "-" (tag Docker não aceita "/"). O sha7 liga a
      # imagem ao commit que a gerou. Não usamos "latest" (não é rastreável).
      - name: Definir referência da imagem
        env:
          # Variable (valor público): vars.NOME. Não é segredo.
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Variable DOCKERHUB_USERNAME não cadastrada no repositório."
            exit 1
          fi
          BRANCH="${GITHUB_REF_NAME//\//-}"
          IMAGE="${DOCKERHUB_USERNAME}/devops-market:${BRANCH}-${GITHUB_SHA::7}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "Referência da imagem: ${IMAGE}"

      # BUILD: só constrói a imagem no runner. NÃO publica nada.
      #   -f Dockerfile = caminho do Dockerfile (está na raiz do projeto)
      #   -t $IMAGE     = nome:tag da imagem construída
      #   .             = contexto do build (raiz; o .dockerignore filtra)
      # As labels OCI gravam na imagem o commit e o repositório de origem.
      - name: Build da imagem Docker
        run: |
          docker build \
            -f Dockerfile \
            -t "$IMAGE" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            .
          docker image ls "$IMAGE"

      # TRIVY (relatório informativo): mostra TODAS as HIGH/CRITICAL, inclusive
      # as que ainda não têm correção. exit-code 0 porque este passo só
      # registra a evidência; quem decide é o security gate logo abaixo.
      - name: Trivy - relatório completo (informativo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table

      # TRIVY (SECURITY GATE): a política que reprova a pipeline.
      #   severity HIGH,CRITICAL = só essas severidades contam para bloquear
      #   ignore-unfixed true    = bloqueia quando já existe versão corrigida
      #                            (há o que fazer: atualizar base/dependência).
      #                            As sem correção aparecem no relatório acima
      #                            e são tratadas por risco (slide 34).
      #   exit-code 1            = achou algo da política: o step FALHA e os
      #                            steps de Release abaixo NÃO executam.
      - name: Trivy - security gate (HIGH/CRITICAL com correção)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # O Trivy já foi instalado no passo anterior.
          skip-setup-trivy: true

      # RELEASE: login + push, só quando TUDO abaixo é verdadeiro:
      #   success()                -> Build e Trivy passaram (gate aprovou)
      #   event_name == 'push'     -> evento confiável (PR nunca publica)
      #   ref == branch do aluno   -> só a branch autorizada publica
      #   repository_owner         -> só no meu fork, onde estão MEUS secrets
      - name: Autenticar no Docker Hub
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/47-testes-nome-cliente' && github.repository_owner == 'IsaacGomes260653' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          # Usuário vem de Variable; token vem de Secret (nunca no código).
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Publica a MESMA referência que o Trivy aprovou (nenhum rebuild).
      # O digest impresso no fim identifica o conteúdo publicado.
      - name: Publicar no Docker Hub
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/47-testes-nome-cliente' && github.repository_owner == 'IsaacGomes260653' }}
        run: |
          docker push "$IMAGE"
          echo "Publicado: ${IMAGE}"
          echo "Digest: $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
